<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ConnectSphere - Login</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f8;
      }

      .login-container {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
      }

      .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #1877f2;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #1877f2;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #0d65d9;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }

      .register-link {
        text-align: center;
        margin-top: 20px;
        color: #555;
      }

      .register-link a {
        color: #1877f2;
        text-decoration: none;
        font-weight: bold;
      }

      .register-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">ConnectSphere</div>

      <p class="subtitle">Login to your account</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"> Email </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit">Login</button>
      </form>

      <p id="message"></p>

      <div class="register-link">
        Don't have an account?

        <a href="register.html"> Create Account </a>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");

      const message = document.getElementById("message");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();

        const password = document.getElementById("password").value;

        message.textContent = "Logging in...";

        message.style.color = "#555";

        try {
          const response = await fetch("https://connectsphere-7126.onrender.com/api/auth/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: email,
              password: password,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            /*
             * SAVE LOGIN INFORMATION
             */

            localStorage.setItem("token", data.token);

            /*
             * IMPORTANT:
             * Save the complete user object.
             *
             * index.html uses this object
             * to check whether the user is logged in.
             */

            localStorage.setItem("user", JSON.stringify(data.user));

            /*
             * Also save individual
             * user information.
             */

            localStorage.setItem("username", data.user.username);

            localStorage.setItem("userId", data.user.id);

            localStorage.setItem("name", data.user.name);

            /*
             * SHOW SUCCESS MESSAGE
             */

            message.textContent = "Login successful!";

            message.style.color = "green";

            /*
             * REDIRECT TO HOME FEED
             */

            window.location.href = "./index.html";
          } else {
            message.textContent = data.message || "Invalid email or password.";

            message.style.color = "red";
          }
        } catch (error) {
          console.error(error);

          message.textContent = "Unable to connect to the server.";

          message.style.color = "red";
        }
      });
    </script>
  </body>
</html>
